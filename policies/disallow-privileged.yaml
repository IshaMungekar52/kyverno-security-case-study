
apiVersion: kyverno.io/v1
kind: Policy
metadata:
  name: disallow-privileged
  namespace: default
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: require-privileged-false
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Privileged containers are not allowed. Set securityContext.privileged to false."
        pattern:
          spec:
            containers:
              - securityContext:
                  privileged: false
